[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-gold-scalper"
version = "0.2.0"
description = "Research-first XAUUSD scalping system for MetaTrader 5"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pandas>=2.1", "numpy>=1.26", "PyYAML>=6.0", "pydantic>=2.6"]

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true

[[tool.mypy.overrides]]
module = "MetaTrader5"
ignore_missing_imports = true
